# CI runs on every push and pull request.
# CD deploys https://cryptinsa.com after those tests pass on main.

name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI
  pytest:
    # ubuntu-latest moves to Ubuntu 26.04 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci
      - name: Typecheck
        working-directory: frontend-react
        run: npm run typecheck
      - name: Run tests
        working-directory: frontend-react
        run: npm test
      - name: Build
        working-directory: frontend-react
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-react/dist
          retention-days: 1

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

  dependency-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the three services
        run: docker compose up -d --build
      - name: Call the public routes
        run: bash scripts/ci-smoke.sh
      - name: Stop the stack
        if: always()
        run: docker compose down --remove-orphans

  # CD. Pull requests skip this job. A main push deploys only when the app changed.
  deploy:
    needs: [pytest, frontend, compose-smoke, secret-scan, dependency-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AWS_REGION: eu-west-3
      INSTANCE_ID: i-03c299c48155f375d
      FRONTEND_BUCKET: cryptinsa-frontend-557701609352
      CLOUDFRONT_DISTRIBUTION: E3CUMPYF0VY52K
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide what changed
        id: changes
        run: |
          set -eu
          images=false
          scripts=false
          frontend=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            images=true
            scripts=true
            frontend=true
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              images=true
              scripts=true
              frontend=true
            else
              names=$(git diff --name-only "$before" "${{ github.sha }}")
              if printf '%s\n' "$names" | grep -Eq '^(backend/|nginx/Dockerfile\.origin$|nginx/origin\.conf\.template$|nginx/origin-entrypoint\.sh$|nginx/proxy_params$)'; then
                images=true
              fi
              if printf '%s\n' "$names" | grep -Eq '^deploy/origin/'; then
                scripts=true
              fi
              if printf '%s\n' "$names" | grep -Eq '^frontend-react/'; then
                frontend=true
              fi
            fi
          fi
          if [ "$images" = true ]; then
            scripts=true
          fi
          release=false
          if [ "$images" = true ] || [ "$scripts" = true ] || [ "$frontend" = true ]; then
            release=true
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.changes.outputs.release == 'true'
        with:
          role-to-assume: arn:aws:iam::557701609352:role/cryptinsa-deploy
          aws-region: eu-west-3
      - uses: actions/download-artifact@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          name: frontend-dist
          path: frontend-dist
      - uses: docker/setup-qemu-action@v4
        if: steps.changes.outputs.images == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.images == 'true'
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.changes.outputs.images == 'true'
        id: login
      - name: Build the origin images
        if: steps.changes.outputs.images == 'true'
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          docker buildx build --load --platform linux/arm64 --provenance=false --sbom=false \
            -t cryptinsa-backend:ci ./backend
          docker buildx build --load --platform linux/arm64 --provenance=false --sbom=false \
            -f nginx/Dockerfile.origin \
            -t cryptinsa-nginx:ci ./nginx
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@v0.36.0
        if: steps.changes.outputs.images == 'true'
        with:
          scan-type: image
          image-ref: cryptinsa-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - uses: aquasecurity/trivy-action@v0.36.0
        if: steps.changes.outputs.images == 'true'
        with:
          scan-type: image
          image-ref: cryptinsa-nginx:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          skip-setup-trivy: true
      - name: Release
        if: steps.changes.outputs.release == 'true'
        env:
          CHANGED_IMAGES: ${{ steps.changes.outputs.images }}
          CHANGED_FRONTEND: ${{ steps.changes.outputs.frontend }}
          CHANGED_SCRIPTS: ${{ steps.changes.outputs.scripts }}
          DIST_DIR: frontend-dist
        run: bash scripts/cd-release.sh
