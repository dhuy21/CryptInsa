name: Deploy smoke

on:
  deployment_status:
    states: [success]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'CryptInsa / staging' ||
       github.event.deployment.environment == 'CryptInsa / production')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Call the public routes
        env:
          BASE_URL: ${{ github.event.deployment.environment == 'CryptInsa / production' && 'https://proxy-production-0881.up.railway.app' || 'https://proxy-staging-47ec.up.railway.app' }}
        run: bash scripts/ci-smoke.sh
