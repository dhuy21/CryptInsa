[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-p no:cacheprovider --strict-markers"
markers = [
    "slow: full substitution attack, several seconds per case",
]
filterwarnings = [
    "ignore:The `fitz` API is deprecated:DeprecationWarning",
]
