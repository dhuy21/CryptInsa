name: cryptinsa

services:
  proxy:
    build: ./nginx
    image: cryptinsa-proxy:muc6
    environment:
      FRONTEND_UPSTREAM: frontend:8000
      BACKEND_UPSTREAM: backend:5000
      PORT: "80"
      NGINX_RESOLVER: 127.0.0.11
      NGINX_RESOLVER_IPV6: "off"
      NGINX_RESOLVER_VALID: 10s
    ports:
      - "8000:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:$${PORT}/ && wget -q -O /dev/null http://127.0.0.1:$${PORT}/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build: ./frontend-react
    image: cryptinsa-frontend:muc6
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

  backend:
    build: ./backend
    image: cryptinsa-backend:muc6
    environment:
      DJANGO_SECRET_KEY: cryptinsa-dev-only
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
