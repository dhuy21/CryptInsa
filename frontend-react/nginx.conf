server {
    listen 8000;
    listen [::]:8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative. This server listens on 8000 inside Docker;
    # the browser uses the proxy's published port.
    absolute_redirect off;

    # API traffic belongs to the proxy. This server only has static files.
    location /api/ {
        return 404;
    }

    # Vite writes hashed files in /assets. A missing file is a 404.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A URL that names a file is a file. A missing one is not the React app.
    # /assets/ is matched first, so hashed JavaScript and CSS keep their cache rule.
    location ~* \.(?:js|mjs|css|map|json|txt|xml|webmanifest|html|woff2?|ttf|eot|ico|png|jpe?g|gif|svg|webp)$ {
        try_files $uri =404;
    }

    # index.html names the hashed files, so the browser must revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
